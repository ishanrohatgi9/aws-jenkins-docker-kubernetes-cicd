apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aws-devops-demo
  template:
    metadata:
      labels:
        app: aws-devops-demo
    spec:
      containers:
        - name: web
          image: ishanrohatgi/aws-jenkins-docker-kubernetes-cicd:latest
